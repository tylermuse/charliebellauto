<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A5F" />

    <style>
      :root {
        /* Nobi chat button */
        --nobi-button-background: #1E3A5F;

        /* Nobi chat modal */
        --nobi-chatbot-border-radius: 12px;
        --nobi-chatbot-close-icon-color: #ffffff;
        --nobi-new-chat-button-color: #1E3A5F;
        --nobi-new-chat-button-hover-color: #172D4A;
        --nobi-new-chat-button-text-color: #ffffff;
        --nobi-new-chat-button-border-radius: 8px;

        /* Nobi toggle (search mode) */
        --nobi-toggle-font-family: 'Inter', system-ui, sans-serif;
        --nobi-toggle-default-background: #1E3A5F;
        --nobi-toggle-ai-background: #1E3A5F;
        --nobi-toggle-selected-text-color: #ffffff;
        --nobi-toggle-text-color: #4b5563;
        --nobi-toggle-text-color-hover: #1E3A5F;
      }

      /* Nobi floating search bar */
      .nobi-search-bar {
        --nobi-search-bar-border-radius: 12px;
        --nobi-search-bar-button-background: #1E3A5F;
        --nobi-search-bar-button-border-radius: 8px;
        --nobi-search-bar-button-text-color: #ffffff;
        --nobi-search-bar-button-font-family: 'Inter', sans-serif;
        --nobi-search-bar-icon-color: #1E3A5F;
      }
    </style>

    <title>Charlie Bell Auto | Your Trusted Dealer Since 1987 | Austin, TX</title>

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">

    <!-- Canonical -->
    <link rel="canonical" href="https://charliebellauto.com/" />

    <!-- Basic SEO -->
    <meta name="description" content="Charlie Bell Auto — Austin's trusted dealership since 1987. Shop new & used Toyota, Honda, Ford, Chevrolet, and Hyundai vehicles. No-haggle pricing, certified inspections, and lifetime powertrain warranty.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://charliebellauto.com/">
    <meta property="og:title" content="Charlie Bell Auto | Austin TX Dealership">
    <meta property="og:description" content="Shop 200+ new and used vehicles at Austin's most trusted dealership.">
    <meta property="og:image" content="https://charliebellauto.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Charlie Bell Auto | Austin TX Dealership">
    <meta name="twitter:description" content="Shop 200+ new and used vehicles at Austin's most trusted dealership.">
    <meta name="twitter:image" content="https://charliebellauto.com/og-image.png">

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"AutoDealer",
      "name":"Charlie Bell Auto",
      "url":"https://charliebellauto.com/",
      "telephone":"(512) 555-0199",
      "address":{
        "@type":"PostalAddress",
        "streetAddress":"4200 Auto Mall Parkway",
        "addressLocality":"Austin",
        "addressRegion":"TX",
        "postalCode":"78745",
        "addressCountry":"US"
      },
      "openingHours":["Mo-Fr 09:00-20:00","Sa 09:00-18:00","Su 12:00-17:00"]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>

    <!-- Nobi Assistant -->
    <script src="https://assistant-script.nobi.ai/nobi.bundle.js" async
      onload="window.Nobi.initialize({
        accountId: '3764281b-aa0b-4fc3-b566-c8f7775b570c',
        autoLaunch: ['floating-chat-bar']
      });">
    </script>
  </body>
</html>
